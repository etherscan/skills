name: Validate skills

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  etherscan-flow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/etherscan-flow
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --quiet jsonschema

      - name: Validate examples against case.schema.json
        run: python schema/validate.py

      - name: Run regression tests
        run: python -B -m unittest discover -s schema -p 'test_*.py'
